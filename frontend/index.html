<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LGTM — the Rust playground</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Inline, so the browser asks for no favicon.ico and the page still needs
         exactly one connection: this one. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e1e1e'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='bold' fill='%23ce9178' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  </head>
  <body>
    <header class="page-header">
      <h1 class="page-title">LGTM</h1>
      <p class="page-tagline">Write Rust. It compiles to WebAssembly and runs in a sandbox.</p>
    </header>

    <main class="playground">
      <section class="panel panel-editor">
        <div class="panel-bar">
          <h2 class="panel-title">main.rs</h2>
          <button class="run-button" id="run-button" type="button" disabled>Run</button>
        </div>
        <div class="editor" id="editor"></div>
      </section>

      <section class="panel panel-output" id="output-panel" data-tone="idle">
        <div class="panel-bar">
          <h2 class="panel-title">Output</h2>
          <span class="status">
            <span class="spinner" aria-hidden="true"></span>
            <span class="status-text" id="status">loading the editor</span>
          </span>
        </div>
        <pre class="output" id="output"></pre>
        <p class="reason" id="reason" hidden></p>

        <!-- The share row. It carries the folder on IPFS holding the source and
             what it printed, and it appears only when the backend sent a link. -->
        <footer class="share" id="share" hidden>
          <span class="share-label">Shared at</span>
          <a class="share-link" id="share-link" target="_blank" rel="noopener noreferrer"></a>
          <button class="share-copy" id="share-copy" type="button">Copy</button>
        </footer>
        <p class="share-missing" id="share-missing" hidden></p>
      </section>
    </main>

    <script src="vendor/monaco/vs/loader.js"></script>
    <script src="app.js"></script>
  </body>
</html>
