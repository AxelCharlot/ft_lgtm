# The server that holds the playground page. It replaces the default server of
# nginx:alpine, which serves the welcome page and nothing else.
#
# Traefik sends the host lgtm.local here for every path except /api, so this
# server never sees an API request and never proxies one. The page and the
# backend share one origin, which is why the project needs no CORS header
# anywhere. See k8s/README.md section 3.

# Two extensions the shipped mime.types does not know. Nothing breaks without
# them, because a browser trusts a font by its bytes and this page reads the
# example as text either way, but both would travel as
# application/octet-stream, and a wrong type on the wire is a bug that waits.
#
# This block sits outside the server on purpose: at this level it adds to the
# map that mime.types already built, while the same block inside a server would
# replace that map whole and every other type would be lost.
types {
  font/ttf    ttf;
  text/plain  rs;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The version number helps no visitor and helps anyone scanning.
  server_tokens off;

  # The Dockerfile compressed every text file beside the original, so nginx
  # sends the .gz it already has instead of compressing 3.7 MB of editor on
  # each load. A client that does not accept gzip still gets the plain file.
  gzip_static on;

  # Monaco is vendored at one version and that version cannot change inside an
  # image tag, so the browser may keep it for a year.
  location /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # The page, its script, its style and the example change with every deploy,
  # and the image tag stays v1, so a browser that kept them would show old code
  # after a rollout. "no-cache" means ask first, not do not store: nginx
  # answers 304 from the ETag and the bytes travel once.
  location / {
    add_header Cache-Control "no-cache" always;

    # We declare the type of every file we ship, so a browser never has to
    # guess one, and guessing is how a text file becomes a script.
    #
    # Repeated in both locations, and set in neither the server nor the http
    # level, because add_header does not add: one add_header inside a location
    # drops every header the level above declared. A single line up there would
    # look right and reach nobody.
    add_header X-Content-Type-Options nosniff always;
  }
}
